# Best-effort Node fallback. Fly's free allowance may still ask for a
# credit card. Sleep / scale-to-zero drops in-memory presence.
# Replace `app` after `fly apps create`. Do not treat this file as a live deploy.

app = "codefriends-api-replace-me"
primary_region = "sjc"

[build]
  dockerfile = "apps/server/Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[env]
  PORT = "8787"
  HOST = "0.0.0.0"
  NODE_ENV = "production"
