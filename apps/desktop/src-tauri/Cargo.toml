[package]
name = "codefriends-desktop"
version = "0.1.0"
description = "Native CodeFriends window + tray wrapping the existing popout UI"
authors = ["CodeFriends"]
edition = "2021"
license = "MIT"
rust-version = "1.88"

[lib]
name = "codefriends_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
